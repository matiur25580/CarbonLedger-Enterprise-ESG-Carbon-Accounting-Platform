name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: carbonledger
          POSTGRES_USER: carbonledger
          POSTGRES_PASSWORD: carbonledger_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carbonledger -d carbonledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://carbonledger:carbonledger_dev@localhost:5432/carbonledger
      JWT_ACCESS_SECRET: ci-only-test-signing-secret-do-not-use-in-production
      COOKIE_SECURE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @carbonledger/api exec prisma generate
      - name: Apply database migrations
        run: pnpm --filter @carbonledger/api exec prisma migrate deploy
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
